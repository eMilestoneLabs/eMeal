name: smart_meal_management
description: "MealAttend – Smart Meal & Attendance Management SaaS Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Networking
  dio: ^5.7.0

  # Realtime — Socket.IO client for the B7 gateway (live dashboards)
  socket_io_client: ^2.0.3+1

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  shared_preferences: ^2.3.3

  # Export: PDF generation + file I/O + share
  pdf: ^3.10.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  # Real .xlsx generation (Excel exports with text-formatted datetime)
  excel: ^4.0.0

  # Local notifications — attendance reminders
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # QR scanner — group join flow
  mobile_scanner: ^5.2.3

  # QR generator — admin group/event QR display
  qr_flutter: ^4.1.0

  # Image picker + compression — meal image upload
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
