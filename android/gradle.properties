org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disables Kotlin incremental compilation.
# Required on Windows when the Pub cache (C:\) and project (D:\) are on
# different drives — the incremental compiler cannot relativize paths across
# drive roots and throws an AssertionError during cache flush.
kotlin.incremental=false
