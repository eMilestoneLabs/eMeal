name: Flutter Build

on:
  push:
    branches:
      - emeal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build apk --release
